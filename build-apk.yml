name: Build Rang Manch APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret found - using a TEMPORARY key. Add your keystore secrets so every build has the same signature."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias temp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temp1234 -keypass temp1234 -dname "CN=Rang Manch, O=Rang Manch India, C=IN"
            echo "KEYSTORE_PASSWORD=temp1234" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=temp" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=temp1234" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease -PsiteUrl="${{ vars.SITE_URL }}"

      - name: Show signing certificate (SHA-256)
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner|SHA256" || true

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/RangManch-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/RangManch-${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: RangManch-APK-AAB
          path: dist/*

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

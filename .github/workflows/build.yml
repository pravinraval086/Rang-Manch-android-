name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arrange project folders
        run: |
          set -e
          J=app/src/main/java/dev/workers/rangmanch/app
          R=app/src/main/res
          mkdir -p $J $R/values $R/drawable $R/mipmap-anydpi-v26 $R/mipmap-xxhdpi
          mv -f MainActivity.java $J/
          mv -f AndroidManifest.xml app/src/main/
          mv -f colors.xml strings.xml themes.xml $R/values/
          mv -f ic_launcher_foreground.png $R/drawable/
          mv -f ic_launcher.xml $R/mipmap-anydpi-v26/
          mv -f ic_launcher.png $R/mipmap-xxhdpi/
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RangManch"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def siteUrl = (project.findProperty('siteUrl') ?: '').toString().replaceAll('/+$', '')

          android {
              namespace 'dev.workers.rangmanch.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'dev.workers.rangmanch.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 5074
                  versionName '50.74'
                  buildConfigField 'String', 'SITE_URL', '"' + siteUrl + '"'
              }

              buildFeatures {
                  buildConfig true
              }

              sourceSets {
                  main {
                      assets.srcDirs = [layout.buildDirectory.dir('web-assets').get().asFile]
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.browser:browser:1.8.0'
          }

          tasks.register('unpackWeb', Copy) {
              from zipTree(rootProject.file('web.zip'))
              into layout.buildDirectory.dir('web-assets')
          }
          tasks.named('preBuild') { dependsOn 'unpackWeb' }
          EOF
          ls -R app | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RangManch-APK
          path: app/build/outputs/apk/debug/app-debug.apk
